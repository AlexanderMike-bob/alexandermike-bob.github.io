<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小为窗口大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 爱心参数方程（和 Python 版完全一致）
        function hearta(k) {
            return 15 * Math.pow(Math.sin(k), 3);
        }

        function heartb(k) {
            return 12 * Math.cos(k)
                 - 5 * Math.cos(2 * k)
                 - 2 * Math.cos(3 * k)
                 - Math.cos(4 * k);
        }

        // 将坐标原点移到画布中心
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = 12; // 缩放系数，可根据屏幕调整

        ctx.strokeStyle = '#F74667';
        ctx.lineWidth = 1;

        // 逐帧绘制，模拟 turtle 的慢速绘制效果
        let i = 0;
        const total = 600;

        function draw() {
            if (i >= total) return;

            const x1 = centerX + hearta(i) * scale;
            const y1 = centerY - heartb(i) * scale; // y轴翻转
            const x2 = centerX + hearta(i) * scale * 0.4;
            const y2 = centerY - heartb(i) * scale * 0.4;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            i++;
            requestAnimationFrame(draw);
        }

        draw();

        // 窗口大小改变时重新调整画布
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
