<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Heart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black; /* 对应 bgcolor("black") */
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas"></canvas>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        
        // 让画布铺满全屏
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 获取屏幕中心点，因为 turtle 的 (0,0) 在屏幕正中间，而网页的 (0,0) 在左上角
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 你的原版爱心数学公式
        function hearta(k) {
            return 15 * Math.pow(Math.sin(k), 3);
        }

        function heartb(k) {
            return 12 * Math.cos(k) - 5 * Math.cos(2 * k) - 2 * Math.cos(3 * k) - Math.cos(4 * k);
        }

        // 开始画线
        ctx.beginPath();
        ctx.strokeStyle = "#F74667"; // 对应 color("#F74667")
        ctx.lineWidth = 1.5; // 线条粗细

        // 对应 for i in range(600)
        for (let i = 0; i < 600; i++) {
            // 计算外圈坐标 (20)
            let x20 = cx + hearta(i) * 20;
            let y20 = cy - heartb(i) * 20; // 网页 Y 轴是向下的，所以要减去

            // 计算内圈坐标 (8)
            let x8 = cx + hearta(i) * 8;
            let y8 = cy - heartb(i) * 8;

            // 相当于 turtle 的 goto()，画出交织的线
            if (i === 0) {
                ctx.moveTo(x20, y20);
            } else {
                ctx.lineTo(x20, y20);
            }
            ctx.lineTo(x8, y8);
        }

        // 把画好的线显示出来
        ctx.stroke();
    </script>
</body>
</html>
